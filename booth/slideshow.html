<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Ender&rsquo;s Graduation &mdash; Photo Slideshow</title>
    <style>
        :root {
            --navy: #0d1520;
            --gold:  #c9a227;
        }

        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { width: 100%; height: 100%; overflow: hidden; background: var(--navy); }

        /* star field */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image:
                radial-gradient(rgba(201,162,39,0.06) 1px, transparent 1px),
                radial-gradient(rgba(255,255,255,0.02) 1px, transparent 1px);
            background-size: 40px 40px, 22px 22px;
            background-position: 0 0, 11px 11px;
            pointer-events: none;
        }

        /* ── stage: two crossfading slides ── */
        .stage {
            position: fixed;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .slide {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.75s ease-in-out;
            pointer-events: none;
        }
        .slide.active { opacity: 1; }

        /* polaroid images already have white frame baked in server-side */
        .polaroid-img {
            max-height: 82vh;
            max-width: 82vw;
            width: auto;
            height: auto;
            display: block;
            border-radius: 1px;
            box-shadow:
                0 24px 64px rgba(0,0,0,0.75),
                0 6px 20px rgba(0,0,0,0.5);
            will-change: transform;
            /* per-photo rotation applied inline */
        }

        /* ── empty state ── */
        .empty {
            position: fixed;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Georgia, serif;
            font-style: italic;
            color: rgba(255,255,255,0.18);
            font-size: clamp(1rem, 3vw, 1.4rem);
            letter-spacing: 0.05em;
            pointer-events: none;
            transition: opacity 0.5s;
        }
        .empty.hidden { opacity: 0; }

        /* ── HUD: counter + fullscreen ── */
        .hud {
            position: fixed;
            bottom: 20px;
            left: 0; right: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            z-index: 100;
            pointer-events: none;
        }

        .counter {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
            font-size: 0.72rem;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            color: rgba(255,255,255,0.2);
        }

        .fs-btn {
            pointer-events: all;
            background: none;
            border: 1px solid rgba(201,162,39,0.25);
            border-radius: 6px;
            padding: 7px 9px;
            cursor: pointer;
            color: rgba(201,162,39,0.5);
            line-height: 0;
            transition: border-color 0.2s, color 0.2s;
            -webkit-tap-highlight-color: transparent;
        }
        .fs-btn:hover, .fs-btn:active {
            border-color: rgba(201,162,39,0.7);
            color: rgba(201,162,39,0.9);
        }

        /* ── progress bar ── */
        .progress {
            position: fixed;
            bottom: 0; left: 0;
            height: 2px;
            background: rgba(201,162,39,0.45);
            width: 0%;
            transition: width linear;
            z-index: 100;
        }
    </style>
</head>
<body>

    <div class="stage">
        <div class="slide" id="slide-a"></div>
        <div class="slide" id="slide-b"></div>
    </div>

    <div class="empty" id="empty">Waiting for the first photo&hellip;</div>

    <div class="hud">
        <span class="counter" id="counter"></span>
        <button class="fs-btn" id="fs-btn" title="Fullscreen">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24"
                 fill="none" stroke="currentColor" stroke-width="1.75"
                 stroke-linecap="round" stroke-linejoin="round">
                <polyline points="15 3 21 3 21 9"/>
                <polyline points="9 21 3 21 3 15"/>
                <line x1="21" y1="3" x2="14" y2="10"/>
                <line x1="3" y1="21" x2="10" y2="14"/>
            </svg>
        </button>
    </div>

    <div class="progress" id="progress"></div>

    <script>
        var INTERVAL   = 6000;  // ms per photo
        var PRELOAD_MS = 500;   // start preloading this many ms before advance

        var slides   = [document.getElementById('slide-a'), document.getElementById('slide-b')];
        var emptyEl  = document.getElementById('empty');
        var counterEl = document.getElementById('counter');
        var progressEl = document.getElementById('progress');
        var fsBtnEl  = document.getElementById('fs-btn');

        var photos      = [];   // all filenames (order of arrival)
        var currentIdx  = -1;   // index into photos of currently shown photo
        var active      = 0;    // which slide slot is visible (0=a, 1=b)
        var pending     = [];   // newly arrived photos to show next
        var timer       = null;
        var progressTimer = null;
        var busy        = false; // crossfade in progress

        // --- Rotations: stable per-index so same photo always has same tilt ---
        var ROTATIONS = [-3.2, 2.1, -1.8, 3.4, -2.6, 1.5, -4.1, 2.8, -1.2, 3.7];
        function rotationFor(idx) {
            return ROTATIONS[idx % ROTATIONS.length];
        }

        // --- Counter display ---
        function updateCounter() {
            if (photos.length === 0) { counterEl.textContent = ''; return; }
            counterEl.textContent = (currentIdx + 1) + ' / ' + photos.length;
        }

        // --- Progress bar ---
        function startProgress() {
            progressEl.style.transition = 'none';
            progressEl.style.width = '0%';
            requestAnimationFrame(function() {
                requestAnimationFrame(function() {
                    progressEl.style.transition = 'width ' + INTERVAL + 'ms linear';
                    progressEl.style.width = '100%';
                });
            });
        }
        function resetProgress() {
            progressEl.style.transition = 'none';
            progressEl.style.width = '0%';
        }

        // --- Crossfade to a photo by filename ---
        function crossfadeTo(filename, idx) {
            if (busy) return;
            busy = true;

            var next = 1 - active;
            var deg  = rotationFor(idx);

            var img = new Image();
            img.className = 'polaroid-img';
            img.style.transform = 'rotate(' + deg + 'deg)';
            img.alt = 'Party photo';

            img.onload = function() {
                slides[next].innerHTML = '';
                slides[next].appendChild(img);

                // Double-rAF ensures browser painted the zero-opacity state first
                requestAnimationFrame(function() {
                    requestAnimationFrame(function() {
                        slides[next].classList.add('active');
                        slides[active].classList.remove('active');
                        active = next;
                        currentIdx = idx;
                        busy = false;

                        emptyEl.classList.add('hidden');
                        updateCounter();
                        scheduleAdvance();
                        startProgress();
                    });
                });
            };

            img.onerror = function() {
                busy = false;
                advance(); // skip broken image
            };

            img.src = '/photos/' + filename + '?t=' + Date.now();
        }

        // --- Advance to next photo ---
        function advance() {
            clearTimeout(timer);
            resetProgress();
            if (photos.length === 0) return;

            var targetIdx;
            if (pending.length > 0) {
                // Prioritise newly arrived photo
                var fn = pending.shift();
                targetIdx = photos.indexOf(fn);
                if (targetIdx < 0) targetIdx = photos.length - 1;
            } else {
                targetIdx = (currentIdx + 1) % photos.length;
            }

            crossfadeTo(photos[targetIdx], targetIdx);
        }

        function scheduleAdvance() {
            clearTimeout(timer);
            timer = setTimeout(advance, INTERVAL);
        }

        // --- Handle photo arriving via WebSocket ---
        function onNewPhoto(filename) {
            photos.push(filename);
            if (currentIdx === -1) {
                // First photo ever — show immediately
                crossfadeTo(filename, 0);
            } else {
                // Queue to show next (person who uploaded wants to see it)
                pending.push(filename);
                updateCounter();
            }
        }

        // --- Handle AI-style update for an existing photo ---
        function onPhotoUpdated(filename) {
            var idx = photos.indexOf(filename);
            if (idx < 0) return;
            // If this photo is currently on screen, refresh it in-place
            if (idx === currentIdx) {
                var showing = slides[active].querySelector('img');
                if (showing) {
                    showing.src = '/photos/' + filename + '?t=' + Date.now();
                }
            }
        }

        // --- Load existing photos on startup ---
        fetch('/api/photos')
            .then(function(r) { return r.json(); })
            .then(function(list) {
                photos = list;
                if (photos.length > 0) {
                    // Start from the most recently uploaded photo
                    crossfadeTo(photos[photos.length - 1], photos.length - 1);
                }
            })
            .catch(function() {});

        // --- WebSocket ---
        function connect() {
            var proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
            var ws    = new WebSocket(proto + '//' + location.host + '/ws');

            ws.onmessage = function(ev) {
                var data = JSON.parse(ev.data);
                if (!data.photo) return;

                if (data.updated) {
                    onPhotoUpdated(data.photo);
                } else if (!data.existing) {
                    onNewPhoto(data.photo);
                }
                // existing photos on connect: already loaded via /api/photos
            };

            ws.onclose = function() { setTimeout(connect, 3000); };
        }

        connect();

        // --- Tap/click anywhere to advance ---
        document.addEventListener('click', function(e) {
            if (e.target === fsBtnEl || fsBtnEl.contains(e.target)) return;
            if (photos.length > 1) advance();
        });

        // --- Keyboard ---
        document.addEventListener('keydown', function(e) {
            if (e.key === 'f' || e.key === 'F') toggleFullscreen();
            if (e.key === 'ArrowRight' || e.key === ' ') {
                e.preventDefault();
                if (photos.length > 1) advance();
            }
        });

        // --- Fullscreen ---
        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(function(){});
            } else {
                document.exitFullscreen();
            }
        }

        fsBtnEl.addEventListener('click', toggleFullscreen);
    </script>
</body>
</html>
